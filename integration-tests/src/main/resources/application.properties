# quarkus-social sample: the application user "ann" publishes to the Fediverse (as the ActivityPub actor "ann") and to
# Bluesky (as the AT Protocol account she linked) with one call. See docs/modules/ROOT/pages/getting-started.adoc.

# ---- ActivityPub ----
# The public origin of the application; actor ids and the inbox live under it. Production sets it from the
# environment (QUARKUS_ACTIVITYPUB_BASE_URL, e.g. https://ap-test.example.net); the ITs point it at the application's
# loopback port.
%dev.quarkus.activitypub.base-url=http://localhost:8080
# Poll deliveries every second so dev mode and the tests see results quickly; production keeps the default interval.
%dev.quarkus.activitypub.delivery.poll-interval=1s
%test.quarkus.activitypub.delivery.poll-interval=1s

# ---- AT Protocol (Bluesky): link mode, the application has its own accounts ----
quarkus.atproto.oauth.mode=link
quarkus.atproto.oauth.client-name=quarkus-social sample
# The scope the default output (quarkus.social.atproto.output=post-and-document) needs, as ScopeAdvisor computes it
# (logged at startup and shown in the Dev UI card when the configured scope does not cover it).
quarkus.atproto.oauth.scope=atproto repo:app.bsky.feed.post?action=create&action=delete repo:site.standard.document?action=create&action=update&action=delete
# Production (a confidential client) needs, set from the environment:
#   quarkus.atproto.oauth.client-base-url=https://blog.example
#   quarkus.atproto.oauth.signing-key.location=/run/secrets/atproto-client-key.pem
#   quarkus.atproto.oauth.session.encryption-key=<at least 32 random characters>
# In dev mode none of this is needed: the localhost development client is used. The development client is refused in
# production and its redirect URI is on 127.0.0.1, so a public deployment must use the confidential client above.

# ---- the application's own sign-in: basic auth, embedded users (fixed at build time, so on in every profile) ----
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
# Production: the sample ships no user. Supply one from the environment, for example
#   QUARKUS_SECURITY_USERS_EMBEDDED_USERS_ANN=<a long random password>
# and, behind a TLS-terminating reverse proxy, let the same-origin check see the public scheme and host:
#   quarkus.http.proxy.proxy-address-forwarding=true
#   quarkus.http.proxy.allow-x-forwarded=true
#   quarkus.http.proxy.enable-forwarded-host=true
# (the proxy must send X-Forwarded-Proto, X-Forwarded-Host and X-Forwarded-For).
%dev.quarkus.security.users.embedded.users.ann=ann-password
%test.quarkus.security.users.embedded.users.ann=ann-password

# ---- storage: publish state (quarkus-social-hibernate) and ActivityPub state (quarkus-activitypub-hibernate) ----
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:social;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# ---- the fakes ----
# The packaged-app ITs run with the test profile; their test resource (org.acme.social.SocialFakes) adds the fakes'
# URLs, the ActivityPub base URL and the confidential client's settings.
quarkus.test.integration-test-profile=test
# The fakes are on loopback over plain http: allowed in dev and tests only
%dev.quarkus.safe-fetch.https-only=false
%dev.quarkus.safe-fetch.allow-private-addresses=true
%test.quarkus.safe-fetch.https-only=false
%test.quarkus.safe-fetch.allow-private-addresses=true
